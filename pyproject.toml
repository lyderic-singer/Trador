[project]
name = "trador"
version = "0.1.0"
description = "Async multi-exchange trading framework: Hyperliquid, Arcus, Lighter, Aster"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "websockets",
    "eth-account",
    "eth-utils",
    "msgpack",
    "cryptography",
    "python-dotenv",
    "python-telegram-bot",
    "tzdata>=2026.6",
]

[project.scripts]
trador = "main:run"

[dependency-groups]
# installed by default by `uv sync` / `uv run`
dev = ["pytest"]
# heavy dependencies for offline research and charts (not used by the bot):
# `uv sync --all-groups` once, or `uv run --group tools python ...`
tools = ["numpy", "pandas", "scipy", "numba", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# every package of src/ (core, adapters, strategies, log, tools) and src/main.py are top-level modules.
# uv installs the project in editable mode: src/ is put on sys.path, so `uv run python -m tools.x` works from the root
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
